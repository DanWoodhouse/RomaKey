# Generate the Xcode project with XcodeGen: `brew install xcodegen && xcodegen`
name: JapaneseKeyboard
options:
  bundleIdPrefix: com.danwoodhouse
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    # Foundation Models needs iOS 26; weak-linking keeps the app running on older versions.
    OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  KeyboardCore:
    path: Packages/KeyboardCore
targets:
  JapaneseKeyboard:
    type: application
    platform: iOS
    sources:
      - App
      - Shared/KeyboardTheme.swift  # for the theme previews in Settings
      - Shared/AIProbe.swift
      - Shared/AIAssistant.swift
    entitlements:
      path: App/JapaneseKeyboard.entitlements
      properties: &appGroups
        com.apple.security.application-groups: [group.com.danwoodhouse.JapaneseKeyboard]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 日本語キーボード
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danwoodhouse.JapaneseKeyboard
    dependencies:
      - package: KeyboardCore
      - target: RomajiKeyboard
      - target: KanaKeyboard
  # The same keyboard listed twice in Settings: ローマ字 opens on the QWERTY board, かな on the flick
  # board. The mode wheel switches boards inside either one.
  RomajiKeyboard:
    templates: [KeyboardExtension]
    sources: [RomajiKeyboard, Shared]
    entitlements:
      path: RomajiKeyboard/RomajiKeyboard.entitlements
      properties: *appGroups
    info:
      path: RomajiKeyboard/Info.plist
      properties:
        CFBundleDisplayName: ローマ字
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).RomajiKeyboardViewController
          NSExtensionAttributes: &keyboardAttributes
            PrimaryLanguage: ja-JP
            IsASCIICapable: false
            PrefersRightToLeft: false
            # Full Access lets the keyboards read settings from the shared App Group, use
            # haptics and paste. The only network requests are GIF searches, once a GIPHY key is added.
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danwoodhouse.JapaneseKeyboard.Romaji
  KanaKeyboard:
    templates: [KeyboardExtension]
    sources: [KanaKeyboard, Shared]
    entitlements:
      path: KanaKeyboard/KanaKeyboard.entitlements
      properties: *appGroups
    info:
      path: KanaKeyboard/Info.plist
      properties:
        CFBundleDisplayName: かな
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KanaKeyboardViewController
          NSExtensionAttributes: *keyboardAttributes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danwoodhouse.JapaneseKeyboard.Kana
targetTemplates:
  KeyboardExtension:
    type: app-extension
    platform: iOS
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: KeyboardCore
